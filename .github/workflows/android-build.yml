name: Rubina Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Rubina APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Rubina Project
        run: |
          set -e

          echo "Searching for Gradle project..."

          if find . -maxdepth 3 -name "settings.gradle" -o -name "settings.gradle.kts" | grep -q .; then
            echo "Gradle project already exists."
          else
            echo "Gradle project not found."
            echo "Searching for ZIP files..."

            ZIP_FILE=$(find . -type f -iname "*.zip" -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No ZIP file and no Gradle project found."
              echo "The repository must contain the Rubina project files or a ZIP file."
              exit 1
            fi

            echo "ZIP found:"
            echo "$ZIP_FILE"

            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted

            echo "ZIP extracted."
          fi

      - name: Find Gradle Project
        run: |
          set -e

          SETTINGS_FILE=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."
            echo "Repository contents:"
            find . -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "================================"
          echo "Gradle project found:"
          echo "$PROJECT_DIR"
          echo "================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show Project
        run: |
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 5 -type f | sort

      - name: Build Rubina APK
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "Current directory:"
          pwd

          echo ""
          echo "Starting Gradle build..."

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Find APK
        if: always()
        run: |
          echo "================================"
          echo "APK FILES"
          echo "================================"

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print

          echo "================================"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rubina-APK
          path: |
            **/app/build/outputs/apk/**/*.apk
            **/app/build/outputs/apk/*.apk
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rubina-Build-Log
          path: build.log
          if-no-files-found: warn
