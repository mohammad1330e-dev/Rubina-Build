name: Rubina Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Rubina APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Gradle Project
        run: |
          echo "Searching for settings.gradle..."

          PROJECT_DIR=$(find . -name "settings.gradle" -not -path "./.git/*" -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Gradle project found in:"
          echo "$PROJECT_DIR"

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show Project
        run: |
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort

      - name: Build Rubina APK
        run: |
          cd "$PROJECT_DIR"

          echo "Current directory:"
          pwd

          echo "Gradle files:"
          ls -la

          echo "Starting APK build..."

          set -o pipefail

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Find APK
        if: always()
        run: |
          echo "================================"
          echo " APK FILES"
          echo "================================"

          find "$GITHUB_WORKSPACE" -type f -name "*.apk" -print

          echo "================================"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rubina-APK
          path: |
            **/app/build/outputs/apk/**/*.apk
            **/app/build/outputs/apk/*.apk
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rubina-Build-Log
          path: build.log
          if-no-files-found: warn
