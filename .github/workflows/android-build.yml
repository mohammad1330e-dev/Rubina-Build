name: Rubina Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Rubina APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show Project
        run: |
          echo "===== PROJECT ====="
          pwd
          find . -maxdepth 5 -type f | sort
          echo "==================="

      - name: Build Rubina APK
        id: build
        run: |
          set +e

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info > build.log 2>&1

          RESULT=$?

          echo "===== GRADLE OUTPUT =====" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 build.log >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "===== END GRADLE OUTPUT =====" >> "$GITHUB_STEP_SUMMARY"

          exit $RESULT

      - name: Find APK
        if: always()
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print
          echo "===================="

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rubina-APK
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/*.apk
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rubina-Build-Log
          path: build.log
          if-no-files-found: warn
