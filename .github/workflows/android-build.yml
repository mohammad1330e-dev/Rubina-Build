name: Rubina Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Rubina APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Rubina Project
        run: |
          set -e

          echo "Searching for Gradle project..."

          SETTINGS_FILE=$(find . \
            -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            echo "Gradle project already exists."
          else
            echo "Gradle project not found."

            ZIP_FILE=$(find . \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No ZIP file and no Gradle project found."
              exit 1
            fi

            echo "ZIP found: $ZIP_FILE"

            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted

            echo "ZIP extracted."
          fi

      - name: Find Gradle Project
        run: |
          set -e

          SETTINGS_FILE=$(find . \
            -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."
            find . -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Backendless Callback Package
        run: |
          set -e

          FILE="$PROJECT_DIR/app/src/main/java/com/rubina/app/data/RubinaRepository.java"

          if [ -f "$FILE" ]; then
            sed -i 's/com\.backendless\.callbacks\.AsyncCallback/com.backendless.async.callback.AsyncCallback/g' "$FILE"

            if ! grep -q "import com.backendless.async.callback.AsyncCallback;" "$FILE"; then
              sed -i '/import com.backendless.Backendless;/a import com.backendless.async.callback.AsyncCallback;' "$FILE"
            fi

            sed -i '/import com\.backendless\.persistence\.DataQueryBuilder;/d' "$FILE"
            sed -i '/import java\.util\.List;/d' "$FILE"

            echo "Backendless callback package fixed."
          else
            echo "RubinaRepository.java not found."
          fi

      - name: Show Project
        run: |
          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
