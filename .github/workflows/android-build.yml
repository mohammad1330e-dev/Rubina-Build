name: Rubina Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Rubina APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Project
        run: |
          echo "================================"
          echo " RUBINA PROJECT CHECK"
          echo "================================"
          echo "Java version:"
          java -version
          echo ""
          echo "Gradle version:"
          gradle --version
          echo ""
          echo "Project files:"
          find . -maxdepth 5 -type f | sort
          echo ""
          echo "================================"

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee build.log

      - name: Find APK
        if: always()
        run: |
          echo "================================"
          echo " APK SEARCH"
          echo "================================"
          find . -type f -name "*.apk" -print
          echo "================================"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rubina-APK
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/*.apk
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rubina-Build-Log
          path: build.log
          if-no-files-found: warn
